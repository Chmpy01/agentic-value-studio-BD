.reason-select{display:flex;gap:9px;overflow-x:auto;padding:10px 2px 18px}.reason-select .econ-case{min-width:205px;flex:1}.reason-title{display:flex;align-items:center;gap:15px;background:linear-gradient(110deg,#113967,#155cad);color:#fff;border-radius:18px;padding:19px 23px;margin-bottom:15px}.reason-title .reason-emblem{width:54px;height:54px;display:grid;place-items:center;background:#ffffff20;border-radius:16px}.reason-title .reason-emblem svg{height:28px;width:28px}.reason-title small{color:#afd8ff;letter-spacing:.1em;font-size:10px;font-weight:800}.reason-title h3{margin:5px 0 4px;font-size:20px}.reason-title p{font-size:12px;margin:0;color:#daecff}.reason-chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.reason-stage{border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:12px;min-height:250px;position:relative}.reason-stage:not(:last-child)::after{content:'›';position:absolute;right:-13px;top:50%;font-size:28px;color:var(--blue);z-index:2;font-weight:800}.reason-stage-header{padding:5px 2px 10px;display:flex;flex-direction:column;gap:5px}.reason-stage-header span{font-size:10px;letter-spacing:.065em;color:var(--blue);font-weight:850}.reason-stage-header small{font-size:10px;color:var(--sub)}.reason-node{display:flex;align-items:flex-start;text-align:left;gap:9px;background:var(--paper2);border:1px solid var(--line);width:100%;padding:10px 7px;border-radius:12px;margin:6px 0;color:var(--ink);min-height:82px}.reason-node .ic{color:var(--blue);flex:0 0 23px}.reason-node .ic svg{width:20px;height:20px}.reason-node span:not(.ic){display:flex;flex-direction:column;gap:3px;min-width:0}.reason-node small{color:var(--sub);text-transform:uppercase;font-size:9px}.reason-node b{font-size:11px;line-height:1.3;overflow-wrap:anywhere}.reason-node em{font-size:9px;color:var(--teal);font-style:normal}.reason-node:hover,.evidence-card:hover{border-color:#64aaff;transform:translateY(-1px)}.reason-empty{font-size:11px;padding:18px 4px;color:var(--sub)}.reason-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:13px}.insight-panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:18px}.insight-panel h3{font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:13px}.insight-panel h3 .ic{color:var(--blue)}.insight-panel h3 svg{width:18px}.linked-evidence{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding:10px 0;color:var(--ink);font-size:12px}.linked-evidence span{color:var(--sub);font-size:11px}.footnote{font-size:11px;color:var(--sub);line-height:1.55;margin:12px 0 0}.evidence-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.evidence-stats .stat{min-height:125px}.evidence-actions{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.evidence-actions .filter-chip span{opacity:.55}.evidence-grid{display:grid;grid-template-columns:1.5fr .85fr;gap:15px}.evidence-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start}.evidence-card{display:flex;gap:12px;text-align:left;align-items:flex-start;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:16px;color:var(--ink);min-height:125px}.evidence-icon{border-radius:13px;background:#e9f4ff;color:var(--blue);padding:10px}.evidence-icon svg{width:19px}.evidence-card span:nth-child(2){display:flex;flex-direction:column;gap:6px;flex:1}.evidence-card b{font-size:13px}.evidence-card small{font-size:10px;color:var(--teal);text-transform:uppercase}.evidence-card em{font-style:normal;font-size:11px;color:var(--sub)}.evidence-arrow{color:var(--blue)}.evidence-side{display:flex;flex-direction:column;gap:13px}.gate{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:11px 0;font-size:12px}.gate .ic{color:var(--teal)}.gate svg{width:17px}.discovery-shell{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.discovery-form{padding:22px}.discovery-form h3{font-size:19px}.discovery-form label{display:block;font-weight:760;font-size:12px;margin:14px 0}.discovery-form label input,.discovery-form label textarea,.discovery-form label select{display:block;width:100%;margin-top:7px;resize:vertical}.discovery-actions{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}.discovery-help{display:flex;flex-direction:column;gap:14px}.onboard-step{display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);padding:15px 0;font-size:13px}.onboard-step b{border-radius:50%;width:27px;height:27px;display:grid;place-items:center;flex-shrink:0;background:#e2f2ff;color:var(--blue)}

</style></head><body>
<div class="app">
<header class="top"><div class="brand"><div class="mark" id="logo"></div><div><h1>Cognitive Value Studio</h1><p>CONNECTED INTELLIGENCE → MEASURABLE VALUE</p></div></div><div class="top-actions"><div class="select-wrap"><span id="packSelectIcon" class="ic"></span><label style="flex:1;min-width:0"><span class="tiny">Loaded knowledge pack</span><select id="packSelect" aria-label="Choose industry knowledge pack"></select></label><span id="packChevron" class="ic"></span></div><button class="ui-btn" id="themeBtn" type="button"><span id="themeIcon" class="ic"></span><span class="label-text">Theme</span></button><button class="ui-btn" type="button" id="importQuick"><span id="uploadIcon" class="ic"></span><span class="label-text">Import JSON</span></button><input type="file" id="packFile" accept="application/json,.json" multiple hidden></div></header>
<div class="shell"><div class="toprow"><nav id="nav" class="nav" aria-label="Studio modes"></nav><div id="lens" class="lens" role="group" aria-label="Audience perspective"></div></div>
<div class="microbar"><div><span class="industry" id="industryLabel"></span> <span class="desc" id="subtitle"></span></div><div class="meta"><span class="pill synthetic" id="statusBadge">SYNTHETIC EXAMPLE</span><span class="pill" id="graphCount"></span></div></div>
<main id="main" aria-live="polite"></main></div>
<footer class="footer"><div>Prototype v1 · <strong>Value Twin before Digital Twin</strong> · No network or AI calls at runtime</div><span>Actual-value claims require customer evidence and validation · Keyboard: ← → in Story</span></footer>
</div><div id="toast" role="status" class="toast"></div>
<script id="pack-json" type="application/json">__PACKS__</script>
<script id="art-json" type="application/json">__ART__</script>
<script>
(()=>{'use strict';
const PACKS=JSON.parse(document.getElementById('pack-json').textContent),ART=JSON.parse(document.getElementById('art-json').textContent);
const paths={logo:'<path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5M12 12v10"/>',building:'<path d="M4 21V3h12v18M16 9h4v12M2 21h20M8 7h4M8 11h4M8 15h4"/>',handshake:'<path d="M2 12l4 4 5-5m11 1-4 4-5-5M2 8l5-5 5 3M22 8l-5-5-5 3M7 16l5 5 5-5"/>',network:'<circle cx="12" cy="4" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M11 6 5 17m8-11 6 11M6 19h12"/>',play:'<path d="m8 5 11 7-11 7V5Z"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',chart:'<path d="M4 20V12m6 8V4m6 16v-8m5 8V7M2 21h21"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M2 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 10v-2a5 5 0 0 0-3-4.6"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/>',activity:'<path d="M2 12h5l3-7 4 14 3-7h5"/>',briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 13h18"/>',shield:'<path d="m12 2 9 4v6c0 6-4 9-9 10-5-1-9-4-9-10V6l9-4Z"/><path d="m8 12 3 3 5-6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',chev:'<path d="m6 9 6 6 6-6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4 12H2m20 0h-2M5 5l2 2m10 10 2 2m0-14-2 2M7 17l-2 2"/>',moon:'<path d="M20 15A8 8 0 0 1 9 4 8 8 0 1 0 20 15Z"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3"/>',notes:'<path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/>',check:'<path d="m4 12 5 5L20 6"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',reload:'<path d="M21 11a9 9 0 1 0-3 7M21 4v7h-7"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/>'};
const ico=(name,cls='')=>`<span class="ic ${cls}"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.layers}</svg></span>`;
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=x=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(x);
const idx=()=>new Map(state.pack.nodes.map(n=>[n.id,n]));
const get=id=>state.pack.nodes.find(n=>n.id===id);
const relation=(id)=>state.pack.edges.filter(e=>e.from===id||e.to===id).map(e=>({e,other:get(e.from===id?e.to:e.from)})).filter(x=>x.other);
const state={hypothesis:0,evidenceFilter:'all',discovery:{customer:'',sector:'office',scope:'',objectives:'',notes:''},pack:PACKS[0],mode:'story',lens:'customer',stage:0,selected:'h1',type:'all',search:'',track:0,caseNo:0,capture:null,opportunity:null,showNotes:false,dark:false,custom:null};
let lastToastTimer;
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(lastToastTimer);lastToastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function validate(p){let errors=[];if(!p||typeof p!=='object'){return ['Pack must be a JSON object']};for(const k of ['packId','nodes','edges','story','navigation','tracks','scene'])if(!(k in p))errors.push('Missing '+k);if(errors.length)return errors;
 if(!Array.isArray(p.nodes)||!Array.isArray(p.edges)||!Array.isArray(p.story)||!Array.isArray(p.navigation)||!Array.isArray(p.tracks)){return ['Invalid collections']};
 let seen=new Set;for(const n of p.nodes){if(!n.id||!n.title||!n.type)errors.push('Invalid node entry');if(seen.has(n.id))errors.push('Duplicate node ID '+n.id);seen.add(n.id)}
 for(const e of p.edges)if(!seen.has(e.from)||!seen.has(e.to))errors.push('Dangling edge '+e.from+' -> '+e.to);
 for(const s of p.story)for(const id of (s.focusNodeIds||[]))if(!seen.has(id))errors.push('Missing scene reference '+id);
 for(const t of p.tracks)for(const id of (t.nodeIds||[]))if(!seen.has(id))errors.push('Missing track reference '+id);
 for(const h of ((p.scene||{}).hotspots||[]))if(!seen.has(h.nodeId))errors.push('Missing hotspot reference '+h.nodeId);
 if(p.story.length<2)errors.push('At least two story scenes required'); if(p.navigation.length===0)errors.push('No navigation provided');return [...new Set(errors)]}
function imgSrc(){const key=state.pack.theme?.visualKey||'office';return ART[key]||ART.office}
function header(){document.documentElement.style.setProperty('--accent',state.pack.theme?.accent||'#176ee8');document.getElementById('logo').innerHTML=ico('logo');document.getElementById('packSelectIcon').innerHTML=ico('layers');document.getElementById('packChevron').innerHTML=ico('chev');document.getElementById('uploadIcon').innerHTML=ico('upload');document.getElementById('themeIcon').innerHTML=ico(state.dark?'sun':'moon');
 document.getElementById('industryLabel').textContent=state.pack.industry;document.getElementById('subtitle').textContent='· '+(state.pack.subtitle||'Graph-driven enterprise value storytelling');
 document.getElementById('statusBadge').textContent=state.pack.status==='synthetic'?'SYNTHETIC DEMONSTRATION':(state.pack.status||'draft').toUpperCase();
 document.getElementById('graphCount').textContent=`${state.pack.nodes.length} knowledge nodes · ${state.pack.edges.length} links`;
 const selects=[...PACKS,...(state.custom?[state.custom]:[])];document.getElementById('packSelect').innerHTML=selects.map(p=>`<option value="${esc(p.packId)}" ${p.packId===state.pack.packId?'selected':''}>${esc(p.name)}</option>`).join('');
 document.getElementById('nav').innerHTML=(state.pack.navigation||[]).map(n=>`<button type="button" data-mode="${esc(n.id)}" class="${state.mode===n.id?'active':''}" aria-current="${state.mode===n.id?'page':'false'}">${ico(n.icon)} ${esc(n.label)}</button>`).join('');
 document.getElementById('lens').innerHTML=Object.entries(state.pack.lenses||{customer:{label:'Customer'},partner:{label:'Partner'},cisco:{label:'Cisco + ecosystem'}}).map(([key,l])=>`<button type="button" class="${state.lens===key?'active':''}" data-lens="${esc(key)}">${esc(l.label)}</button>`).join('');
}
function render(){header();const main=document.getElementById('main');if(state.mode==='story')main.innerHTML=story();else if(state.mode==='signals')main.innerHTML=signals();else if(state.mode==='evidence')main.innerHTML=evidence();else if(state.mode==='new')main.innerHTML=discovery();else if(state.mode==='explore')main.innerHTML=explore();else if(state.mode==='graph')main.innerHTML=graph();else if(state.mode==='economics')main.innerHTML=economics();else main.innerHTML=lab();}
function pointHTML(arr){return (arr||[]).slice(0,4).map((txt,i)=>`<div class="point-item"><span class="num">${i+1}</span><span>${esc(txt)}</span></div>`).join('')}
function hotspots(s){if(!['twin','reason','hypothesis','ecosystem','loop'].includes(s.visual))return '';return (state.pack.scene?.hotspots||[]).filter(h=>['signal','asset','energy','people'].includes(get(h.nodeId)?.type)||get(h.nodeId)?.type==='signal').map((h,i)=>{const n=get(h.nodeId);return `<button class="hotspot" type="button" style="left:${h.x}%;top:${h.y}%" title="Explore: ${esc(n?.title)}" aria-label="Explore ${esc(n?.title)}" data-pick="${esc(h.nodeId)}">${ico(n?.icon||'activity')}</button>`}).join('')}
function floatCards(s){if(s.visual==='board'||s.visual==='functions'||s.visual==='problem')return '';let arr=s.focusNodeIds.map(get).filter(n=>n&&['hypothesis','signal','capability'].includes(n.type)).slice(0,3);return `<div class="float-cards">${arr.map(n=>`<div class="float-card">${esc(n.title)}<small>${esc(n.type)} · ${esc(n.evidenceStatus)}</small></div>`).join('')}</div>`}
function story(){let p=state.pack,s=p.story[state.stage]||p.story[0];let notes=state.showNotes?'open':'';let l=p.lenses?.[state.lens]||{label:state.lens,description:''};return `<section class="section">
<div class="scene-top"><div class="steps" aria-label="Story scenes">${p.story.map((s,i)=>`<button type="button" data-step="${i}" class="step ${i===state.stage?'active':i<state.stage?'done':''}" ${i===state.stage?'aria-current="step"':''}><b>${i+1}</b><span>${esc(s.title)}</span></button>`).join('')}</div><span class="pill">${state.stage+1} of ${p.story.length}</span></div>
<div class="scene-grid"><div class="canvas"><img class="scene-image" src="${imgSrc()}" alt="Illustrative isometric view of ${esc(p.industry)}"><div class="canvas-eyebrow">${esc(s.visual==='problem'?'Existing fragmented technology':s.visual==='loop'?'Closed-loop value realisation':'Business Value Twin · '+s.visual)}</div>${hotspots(s)}${floatCards(s)}<div class="canvas-badge">${ico('spark')} ${esc(s.visual==='problem'?'Great dashboards. An unanswered business question.':s.visual==='twin'?'Value model precedes any full digital twin':'One enterprise story · connected evidence')}</div><div class="canvas-watermark">CONCEPT VISUAL · NO CUSTOMER TELEMETRY</div></div>
<article class="story-copy card"><span class="overline">${esc(s.eyebrow||s.title)}</span><h2>${esc(s.headline)}</h2><p class="lead">${esc(s.explanation)}</p><div class="rule"></div><div class="point-list">${pointHTML(s.keyPoints)}</div><div class="lens-callout">${ico(l.icon||'target')}<div><div class="smLabel">${esc(l.label)} perspective</div><p>${esc(s.lensTalkingPoints?.[state.lens]||l.description)}</p></div></div></article></div>
<div class="story-bottom"><div class="stage-intro"><span class="circle">${ico('spark')}</span><b>${esc(s.title)}</b><span class="long">Click through to reveal each part of the value story. Presenter notes are separate.</span></div><div class="stage-btns"><button class="ui-btn" id="notesBtn">${ico('notes')} Notes</button><button class="ui-btn" data-prev ${state.stage===0?'disabled':''}>${ico('back')} Back</button><button class="ui-btn primary" data-next>${state.stage===p.story.length-1?'Start again':'Continue'} ${ico('arrow')}</button></div></div>
<div class="notes-panel ${notes}" id="notesPanel"><h3>Presenter talk track · ${esc(s.title)}</h3><p>${esc(s.presenterNotes)}</p><div class="next">Transition: ${esc(s.transition)}</div><div class="next">Evidence reminder: this is a ${esc(p.status)} pack. Do not present its figures as validated customer outcomes.</div></div>
</section>`}
function explore(){const types=['all','board','function','signal','source','hypothesis','metric','capability','partner','offer','risk','stream'];let nodes=state.pack.nodes.filter(n=>(state.type==='all'||n.type===state.type)&&(!state.search||`${n.title} ${n.summary} ${n.type}`.toLowerCase().includes(state.search.toLowerCase())));let n=get(state.selected)||nodes[0]||state.pack.nodes[0];let rel=relation(n.id).slice(0,12);return `<section class="section"><div class="view-header"><div><span class="overline">DYNAMIC ENTITY EXPLORER</span><h2>Follow the evidence, not the product catalogue.</h2><p>Open any connected entity to navigate its business, technology and commercial context.</p></div><span class="pill">${nodes.length} matching entities</span></div><div class="vbody"><aside class="pane card"><h3>Choose a value layer</h3><div class="filter-list">${types.map(t=>`<button class="filter-chip ${state.type===t?'active':''}" data-type="${t}">${esc(t==='all'?'All entities':t)}</button>`).join('')}</div><p style="font-size:12px;color:#7189a0">The menu is generated from each pack's entity types. Each entity connects to other nodes through named graph relationships.</p><div class="detail-sub">Enterprise value streams</div>${state.pack.nodes.filter(n=>n.type==='stream').map(n=>`<button data-pick="${esc(n.id)}" class="link-row" style="margin-bottom:7px">${ico('layers')}<span><b>${esc(n.title)}</b><small>${esc(n.summary)}</small></span></button>`).join('')}</aside><div class="pane card"><input class="search" id="nodeSearch" placeholder="Search objectives, signals, partners…" value="${esc(state.search)}" aria-label="Search graph entities"><div class="node-cards">${nodes.slice(0,35).map(n=>`<button class="node-card ${state.selected===n.id?'active':''}" data-pick="${esc(n.id)}"><div class="chip-head"><span class="ic" style="color:#1677dc">${ico(n.icon)}</span><span class="node-type">${esc(n.type)}</span></div><b>${esc(n.title)}</b><small>${esc(n.summary)}</small></button>`).join('')}</div></div><aside class="pane card details">${details(n)}</aside></div></section>`}
function details(n){if(!n)return `<p>Select a node to explore.</p>`;let rel=relation(n.id).slice(0,13);return `<div class="big-icon">${ico(n.icon||'layers')}</div><span class="overline">${esc(n.type)} · ${esc(n.evidenceStatus||'unverified')}</span><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p><div class="fact">Confidence: ${esc(n.confidence||'not graded')} · Relationship count: ${rel.length}. A graph link does not establish cause and effect.</div><div class="detail-sub">Connected reasoning</div><div class="connected">${rel.map(({e,other})=>`<button class="link-row" data-pick="${esc(other.id)}">${ico(other.icon||'link')}<span><b>${esc(other.title)}</b><small>${esc(e.relation)} · ${esc(other.type)}</small></span></button>`).join('')||'<p>No connected nodes</p>'}</div>`}
function graph(){const t=state.pack.tracks[state.track]||state.pack.tracks[0],nodes=t.nodeIds.map(get).filter(Boolean),sel=get(state.selected)||nodes[0];return `<section class="section"><div class="view-header"><div><span class="overline">CONNECTED KNOWLEDGE GRAPH</span><h2>The traceable chain from customer outcome to partner offer.</h2><p>Choose a graph path. Click each node to see provenance, context and neighbouring relationships.</p></div><span class="pill">${state.pack.edges.length} typed relationships</span></div><div class="graph-toolbar">${state.pack.tracks.map((t,i)=>`<button class="filter-chip ${state.track===i?'active':''}" data-track="${i}">${esc(t.label)}</button>`).join('')}</div><div class="graph-layout"><div class="graph-wrap"><div class="graphpath">${nodes.map((n,i)=>`${i?'<div class="gconn">→</div>':''}<button class="gnode ${state.selected===n.id?'active':''}" data-pick="${esc(n.id)}">${ico(n.icon)}<small>${esc(n.type)}</small><b>${esc(n.title)}</b></button>`).join('')}</div><div style="font-size:11px;text-align:center;color:#acc8df;margin:0 auto 8px;max-width:680px">Typed connections describe why a capability or partner is relevant. Hypotheses require evidence before any causal or value claims.</div></div><aside class="pane card details">${details(sel)}</aside></div></section>`}
function economics(){const cases=state.pack.nodes.filter(n=>n.type==='hypothesis'&&n.financialModel);const n=cases[state.caseNo]||cases[0],m=n.financialModel;const pool=m.annualPoolGBP,pct=state.opportunity??m.opportunityPct,capture=state.capture??m.captureFactor;const gross=pool*pct/100*capture, net=gross-m.serviceAnnualGBP, investment=m.implementationGBP,firstYear=net-investment, roi=investment?firstYear/investment*100:0,payback=net>0?12*investment/net:NaN;const bars=[pool,gross,net,investment];const max=Math.max(...bars,1);return `<section class="section"><div class="view-header"><div><span class="overline">ILLUSTRATIVE VALUE ECONOMICS</span><h2>Qualify the financial hypothesis — before buying technology.</h2><p>Editable synthetic assumptions. The result is a discussion aid, not a customer forecast.</p></div><span class="pill synthetic">UNVALIDATED · MODELLED</span></div><div class="econ-cases">${cases.map((c,i)=>`<button class="econ-case ${state.caseNo===i?'active':''}" data-case="${i}"><small>HYPOTHESIS ${i+1}</small><b>${esc(c.title)}</b></button>`).join('')}</div><div class="summary-stats"><div class="stat"><small>Gross annual value</small><b>${fmt(gross)}</b><span>Before assurance and services</span></div><div class="stat"><small>Net annual value</small><b>${fmt(net)}</b><span>After managed service charge</span></div><div class="stat"><small>Year-one net</small><b>${fmt(firstYear)}</b><span>After investment</span></div><div class="stat"><small>Simple payback</small><b>${Number.isFinite(payback)&&payback>=0?payback.toFixed(1)+' mo':'N/A'}</b><span>Not risk-adjusted</span></div></div><div class="econ-grid"><div class="pane card"><h3>${esc(n.title)}</h3><p style="font-size:12px;color:#69829b">${esc(n.summary)}</p><div class="slider-row"><div class="slider-head"><span>Improvement opportunity</span><output>${pct}%</output></div><input id="pctSlider" type="range" min="0" max="30" step="0.2" value="${pct}"></div><div class="slider-row"><div class="slider-head"><spa function findOutgoing(id,rel){return state.pack.edges.filter(e=>e.from===id&&(!rel||e.relation===rel)).map(e=>get(e.to)).filter(Boolean)}
function findIncoming(id,rel){return state.pack.edges.filter(e=>e.to===id&&(!rel||e.relation===rel)).map(e=>get(e.from)).filter(Boolean)}
function relationText(a,b){let edge=state.pack.edges.find(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a));return edge?`${edge.relation}: ${edge.rationale||'Requires verification'}`:'Proposed interpretation · confirm the relationship';}
function nodeTile(n){return n?`<button data-pick="${esc(n.id)}" class="reason-node">${ico(n.icon||state.pack.ui?.iconMap?.[n.type]||'layers')}<span><small>${esc(n.type)}</small><b>${esc(n.title)}</b><em>${esc(n.evidenceStatus||'unverified')}</em></span></button>`:`<div class="reason-empty">Not established · ask the customer</div>`;}
function signals(){const hyps=state.pack.nodes.filter(n=>n.type==='hypothesis');let h=hyps[Math.min(state.hypothesis,hyps.length-1)]||hyps[0];if(!h)return `<section class="section"><h2>No value hypotheses exist yet</h2><p>Build the starting customer pack first.</p></section>`;
 let sigs=findIncoming(h.id,'supports-hypothesis'), functions=[...new Map(sigs.flatMap(n=>findIncoming(n.id,'informed-by')).map(n=>[n.id,n])).values()], boards=[...new Map(functions.flatMap(n=>findIncoming(n.id,'owned-by')).map(n=>[n.id,n])).values()], sources=[...new Map(sigs.flatMap(n=>findIncoming(n.id,'produces')).map(n=>[n.id,n])).values()];
 let measures=findOutgoing(h.id,'measured-by'), caps=findOutgoing(h.id,'requires-capability'), partners=caps.flatMap(n=>findOutgoing(n.id,'delivered-with')), offers=partners.flatMap(n=>findOutgoing(n.id,'monetises-through')), risks=findOutgoing(h.id,'constrained-by');
 const stage=(title,arr,note)=>`<div class="reason-stage"><div class="reason-stage-header"><span>${esc(title)}</span><small>${esc(note)}</small></div>${arr.length?arr.slice(0,3).map(nodeTile).join(''):'<div class="reason-empty">Evidence or owner required</div>'}</div>`;
 return `<section class="section"><div class="view-header"><div><span class="overline">CROSS-SILO REASONING CANVAS · ${esc(state.pack.industry)}</span><h2>Connect the business decision to what the signals might mean.</h2><p>Choose a hypothesis. The evidence chain is constructed from graph relationships—not from a fixed product slide.</p></div><span class="pill synthetic">Hypothesis ≠ proof</span></div>
 <div class="reason-select">${hyps.map((n,i)=>`<button data-hypothesis="${i}" class="econ-case ${state.hypothesis===i?'active':''}"><small>VALUE THREAD ${i+1}</small><b>${esc(n.title)}</b></button>`).join('')}</div>
 <div class="reason-title"><div class="reason-emblem">${ico('network')}</div><div><small>SELECTED BUSINESS HYPOTHESIS</small><h3>${esc(h.title)}</h3><p>${esc(h.summary)}</p></div></div>
 <div class="reason-chain">${stage('01 · EXECUTIVE INTENT',boards,'Board objective')}${stage('02 · ACCOUNTABILITY',functions,'Buyer coalition')}${stage('03 · OBSERVED OR SUSPECTED SIGNALS',sigs,'No causal claim')}${stage('04 · TESTABLE HYPOTHESIS',[h],'Needs experiment')}${stage('05 · OUTCOME MEASURES',measures,'Baseline required')}${stage('06 · DELIVERY & COMMERCIAL',caps.concat(partners.slice(0,1),offers.slice(0,1)),'After validation')}</div>
 <div class="reason-foot"><div class="insight-panel"><h3>${ico('database')} What must we establish?</h3>${(sources.length?sources:[]).map(n=>`<div class="linked-evidence"><b>${esc(n.title)}</b><span>Data custodian · permitted use · quality · time boundary</span></div>`).join('')||'<p>No data sources linked. Collect customer evidence first.</p>'}<p class="footnote">Status: ${esc(h.evidenceStatus||'unknown')} · Financial numbers, where present, are synthetic.</p></div>
 <div class="insight-panel"><h3>${ico('shield')} What could invalidate the idea?</h3>${risks.map(n=>`<div class="linked-evidence"><b>${esc(n.title)}</b><span>${esc(n.summary)}</span></div>`).join('')||'<p>No documented risk controls yet.</p>'}<p class="footnote">Compare against a control group or before/after baseline. Check alternative explanations and double counting.</p></div>

 </section>`;
}
function evidence(){let p=state.pack,types=['board','signal','source','hypothesis'],rows=(p.evidenceRegister||p.nodes.filter(n=>types.includes(n.type)).map(n=>({nodeId:n.id,status:n.evidenceStatus||'unverified',dataOwner:'To confirm',validationAction:'Confirm evidence'})));let filtered=rows.filter(x=>state.evidenceFilter==='all'||x.status===state.evidenceFilter);let grouped={};rows.forEach(r=>grouped[r.status]=(grouped[r.status]||0)+1);const statuses=['all','observed','validated','hypothesis','unverified','illustrative'];return `<section class="section"><div class="view-header"><div><span class="overline">TRUST, EVIDENCE & ASSURANCE</span><h2>Separate signals, assumptions and validated value.</h2><p>Every high-impact assertion must have an owner, permission, baseline and verification method before it becomes a customer claim.</p></div><span class="pill synthetic">${p.status.toUpperCase()} PACK</span></div>

 <div class="evidence-actions">${statuses.map(t=>`<button class="filter-chip ${state.evidenceFilter===t?'active':''}" data-evidence="${esc(t)}">${esc(t==='all'?'All evidence':t)} <span>${t==='all'?rows.length:grouped[t]||0}</span></button>`).join('')}</div>
 <div class="evidence-grid"><div class="evidence-list">${filtered.length?filtered.map(r=>{let n=get(r.nodeId);return `<button data-pick="${esc(r.nodeId)}" class="evidence-card"><span class="evidence-icon">${ico(n?.icon||'database')}</span><span><b>${esc(n?.title||r.nodeId)}</b><small>${esc(n?.type||'record')} · ${esc(r.status)}</small><em>${esc(r.validationAction||'Customer confirmation required')}</em></span><span class="evidence-arrow">→</span></button>`}).join(''):'<div class="insight-panel">No entities in this evidence state.</div>'}</div><aside class="evidence-side"><div class="insight-panel"><h3>Evidence acceptance gates</h3><div class="gate">${ico('check')} Decision owner and intended outcome</div><div class="gate">${ico('check')} Data provenance and permission</div><div class="gate">${ico('check')} Measurable baseline and boundaries</div><div class="gate">${ico('check')} Alternative explanations and counterfactual</div><div class="gate">${ico('check')} Risk, accessibility and security sign-off</div><div class="gate">${ico('check')} Benefits realisation and review owner</div></div><div class="insight-panel"><h3>Missing customer evidence</h3>${(p.validation?.missingData||[]).slice(0,6).map(x=>`<div class="linked-evidence">${esc(x)}</div>`).join('')}<p class="footnote">A relationship in the graph does not demonstrate an integration, causal effect, contractual commitment or achieved ROI.</p></div></aside></div></section>`;}
function discovery(){const d=state.discovery;return `<section class="section"><div class="view-header"><div><span class="overline">START FROM THE FIRST CUSTOMER CONVERSATION</span><h2>Create a draft Value Twin before you have a technical digital twin.</h2><p>Enter only what the customer actually said. The studio creates a connected discovery scaffold and leaves unverified fields empty.</p></div><span class="pill">LOCAL · NO AI API</span></div><div class="discovery-shell"><div class="discovery-form card"><h3>01 / Customer discovery intake</h3><label>Customer or illustrative account<input id="disc-customer" class="search" maxlength="100" placeholder="Customer / project name" value="${esc(d.customer)}"></label><label>Industry / building context<select id="disc-sector" class="search"><option value="office" ${d.sector==='office'?'selected':''}>Intelligent workplace / buildings</option><option value="retail" ${d.sector==='retail'?'selected':''}>Retail estate</option><option value="manufacturing" ${d.sector==='manufacturing'?'selected':''}>Manufacturing / industrial</option></select></label><label>Organisation / scope<input id="disc-scope" class="search" maxlength="220" placeholder="e.g. UK office portfolio, 12 buildings" value="${esc(d.scope)}"></label><label>Board or executive objectives (one per line)<textarea id="disc-objectives" class="search" rows="4" placeholder="Reduce cost while improving employee experience&#10;Reduce operational carbon&#10;Protect critical operations">${esc(d.objectives)}</textarea></label><label>What was actually said? What remains unknown?<textarea id="disc-notes" class="search" rows="4" placeholder="What leaders told us; known evidence and remaining questions...">${esc(d.notes)}</textarea></label><div class="discovery-actions"><button class="ui-btn primary" data-buildstarter>${ico('spark')} Generate draft connected pack</button><button class="ui-btn" data-startermd>${ico('download')} Export discovery brief</button></div><p class="footnote">The new pack contains placeholders, not invented measurements. It is editable in Pack Studio and should be enriched by the Markdown design-time AI playbooks.</p></div><aside class="discovery-help"><div class="insight-panel"><span class="overline">WHAT GETS GENERATED</span><h3>An accountable graph scaffold</h3><div class="onboard-step"><b>1</b><span>Customer objectives and decision owners</span></div><div class="onboard-step"><b>2</b><span>Signal and source questions</span></div><div class="onboard-step"><b>3</b><span>Three *unvalidated* value hypotheses</span></div><div class="onboard-step"><b>4</b><span>Metrics, risk controls and capability placeholders</span></div><div class="onboard-step"><b>5</b><span>Eight presenter scenes and relationship tracks</span></div></div><div class="insight-panel"><h3>What happens next?</h3><p>Download the starter JSON, then run the discovery, signal, value, ecosystem and quality-gate playbooks with customer-approved research. Re-import the reviewed pack.</p><div class="footnote">The studio is a deterministic renderer. AI operates at design time, not silently on customer records in the browser.</div></div></aside></div></section>`;}
function makeStarter(){let d=state.discovery,account=(d.customer||'Unspecified customer').trim(),goals=d.objectives.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,3),sector=d.sector,template=PACKS.find(x=>x.packId===sector)||PACKS[0];if(!goals.length)goals=['Clarify the board-level business outcome'];let p=JSON.parse(JSON.stringify(template));p.packId='draft-'+sector+'-'+Date.now().toString(36);p.name='Discovery scaffold · '+account;p.customer={name:account,sector:p.industry,scope:d.scope||'Scope to be confirmed'};p.status='draft';p.subtitle='Customer-led discovery · no validated evidence or financial claims';p.provenance={method:'Manual discovery intake, not AI validation',created:new Date().toISOString().slice(0,10),disclaimer:'All hypotheses, measurements, vendor fit and partner offers remain unverified; no synthetic pack metrics retained.',discoveryNotes:d.notes};
 const incomingGoals=goals;const group=p.nodes.filter(x=>x.type==='board');group.forEach((n,i)=>{n.title=incomingGoals[i]||'Board priority '+(i+1)+' — to discover';n.summary='Customer statement / discovery objective; confirm KPI and accountable sponsor';n.evidenceStatus='unverified';n.confidence='to-validate'});
 p.nodes.forEach(n=>{if(n.type!=='board'){n.evidenceStatus='unverified';n.confidence='to-validate';n.summary=({function:'Decision owner to confirm with customer',signal:'Candidate operational signal — no observations collected',source:'Potential source — confirm existence, rights and time window',hypothesis:'Testable outcome hypothesis to be co-designed with customer',metric:'Metric needs baseline, owner, units and assurance',capability:'Capability candidate only after value case validation',partner:'Delivery archetype and responsibilities to be confirmed',offer:'Commercial construct to agree after scope and margin analysis',risk:'Risk / constraint must be tested and signed off',stream:'Reference value stream; mapping to customer requires validation'})[n.type]||n.summary;if(n.type==='source')n.title='Data source '+n.id.slice(1)+' — not connected';if(n.type==='signal')n.title='Signal '+n.id.slice(1)+' — to investigate';if(n.type==='hypothesis'){n.title='Hypothesis '+n.id.slice(1)+' — to co-design';n.financialModel={annualPoolGBP:0,opportunityPct:0,captureFactor:0,implementationGBP:0,serviceAnnualGBP:0,currency:'GBP'}}if(n.type==='metric')n.title='KPI '+n.id.slice(1)+' — baseline missing';if(n.type==='capability')n.title='Capability '+n.id.slice(1)+' — not yet selected';if(n.type==='partner')n.title='Partner role '+n.id.slice(1)+' — to agree';if(n.type==='offer')n.title='Commercial offer '+n.id.slice(1)+' — to design';if(n.type==='risk')n.title='Assurance control '+n.id.slice(1)+' — to assess'}});
 p.validation={stage:'Discovery — draft only',missingData:['Confirm objectives and decision owners','Collect permitted operational baseline','Identify signals and source owners','Co-design testable intervention','Quantify investment and ongoing service economics','Check privacy, security, accessibility and operational safety']};p.evidenceRegister=p.nodes.filter(n=>['board','source','signal','hypothesis'].includes(n.type)).map(n=>({id:'ev-'+n.id,nodeId:n.id,status:'unverified',dataOwner:'Unknown',lastChecked:null,validationAction:'Customer confirmation, sourcing and assurance required'}));p.scene={imagePath:'assets/'+sector+'.webp',hotspots:[]};p.story=p.story.map((x,i)=>({...x,explanation: ['What is the enterprise decision we need to improve?','What outcomes did the customer explicitly state?','Which functions can influence these outcomes?','What do we know and what must we discover?','Which multiple-source signals might correlate?','What controlled test and financial baseline are needed?','Which capabilities and partner roles would a validated case require?','How would value be measured and repeated?'][i],keyPoints:[i===1?goals[0]:'Customer evidence required','Decision or data owner to confirm','No measured or realised value claimed'],presenterNotes:'Discovery-stage talk track. Customer notes: '+(d.notes||'None supplied')+'. Ask for evidence, ownership and approval before advancing.',focusNodeIds: x.focusNodeIds.filter(id=>p.nodes.some(n=>n.id===id))}));return p;}

</ul><div class="fact">Lightweight client-side integrity check. Use the full bundled JSON Schema validator in your design-time pipeline. Data accuracy and permissioning require human review.</div></div><div class="lab-action"><h3>Unanswered customer questions</h3><div class="point-list">${pointHTML(p.validation?.missingData||['Current enterprise objectives','Data access rights','Baseline and sponsor','Financial approval'])}</div><div class="ui-btn ghost" style="width:100%">${ico('shield')} Current stage: ${esc(p.validation?.stage||'Exploratory')}</div></div></div></div></section>`}

 else if('pick'in a){state.selected=a.pick;if(['story','signals','evidence'].includes(state.mode)){state.mode='explore';state.type='all'}render()}
 else if('type'in a){state.type=a.type;state.search='';render()}else if('track'in a){state.track=Number(a.track);state.selected=state.pack.tracks[state.track]?.nodeIds[0]||'h1';render()}
 else if('hypothesis'in a){state.hypothesis=Number(a.hypothesis);render()}else if('evidence'in a){state.evidenceFilter=a.evidence;render()}else if('buildstarter'in a){const pack=makeStarter();state.custom=pack;setPack(pack);toast('Draft generated — evidence not validated')}else if('startermd'in a){save(discoveryMarkdown(),'customer-discovery-draft.md','text/markdown')}else if('case'in a){state.caseNo=Number(a.case);state.capture=null;state.opportunity=null;render()}
 else if('lab'in a){if(a.lab==='import')document.getElementById('packFile').click();if(a.lab==='export')save(JSON.stringify(state.pack,null,2),state.pack.packId+'.json','application/json');if(a.lab==='notes')save(talkTrack(),state.pack.packId+'-presenter-guide.md','text/markdown')}
 else if(button.id==='notesBtn'){state.showNotes=!state.showNotes;document.getElementById('notesPanel')?.classList.toggle('open',state.showNotes)}
});
document.getElementById('main').addEventListener('input',e=>{if(e.target.id.startsWith('disc-')){let k=e.target.id.slice(5);state.discovery[k]=e.target.value;return;}if(e.target.id==='nodeSearch'){state.search=e.target.value;const old=document.activeElement?.selectionStart;render();const input=document.getElementById('nodeSearch');input.focus();input.setSelectionRange(old,old)}else if(e.target.id==='pctSlider'){state.opportunity=Number(e.target.value);render()}else if(e.target.id==='captureSlider'){state.capture=Number(e.target.value)/100;render()}});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;state.mode=b.dataset.mode;state.showNotes=false;render()});
document.getElementById('lens').addEventListener('click',e=>{const b=e.target.closest('[data-lens]');if(!b)return;state.lens=b.dataset.lens;render()});
document.getElementById('themeBtn').addEventListener('click',()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);render()});
document.getElementById('packSelect').addEventListener('change',e=>{const p=[...PACKS,...(state.custom?[state.custom]:[])].find(x=>x.packId===e.target.value);if(p)setPack(p)});
document.getElementById('importQuick').addEventListener('click',()=>document.getElementById('packFile').click());
document.getElementById('packFile').addEventListener('change',async e=>{const files=[...e.target.files||[]];if(!files.length)return;try{const docs=await Promise.all(files.map(async f=>JSON.parse(await f.text())));let p;
if(docs.every(d=>d.moduleType==='cvs-module')){
 if(new Set(docs.map(d=>d.packId)).size!==1)throw new Error('Modules must share one packId');
 p={nodes:[],edges:[]};const allowed=new Set(['schemaVersion','packId','name','industry','subtitle','customer','status','provenance','outcomeTags','validation','theme','navigation','lenses','story','tracks','scene','ui','evidenceRegister']);
 for(const d of docs){for(const [key,v] of Object.entries(d.payload||{})){if(key==='nodes'||key==='edges'){if(!Array.isArray(v))throw new Error('Module '+key+' must be an array');p[key].push(...v)}else if(allowed.has(key)){if(Object.hasOwn(p,key))throw new Error('Duplicate module field '+key);p[key]=v}}}
 if(!p.nodes.length||!p.story)throw new Error('Select the complete related module set');
}else if(docs.length===1&&docs[0].moduleType!=='cvs-module'){p=docs[0]}else throw new Error('Import one compiled pack or multiple related modules');
const errors=validate(p);if(errors.length)throw new Error(errors[0]);p.packId=['office','retail','manufacturing'].includes(p.packId)?'custom-'+p.packId:p.packId;state.custom=p;setPack(p)
}catch(ex){toast('Could not load pack: '+ex.message)}e.target.value=''});
document.addEventListener('keydown',e=>{if(state.mode!=='story'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'){state.stage=(state.stage+1)%state.pack.story.length;state.showNotes=false;render()}if(e.key==='ArrowLeft'){state.stage=Math.max(0,state.stage-1);state.showNotes=false;render()}if(e.key==='Escape'&&state.showNotes){state.showNotes=false;render()}});
render();
})();
</script></body></html>
